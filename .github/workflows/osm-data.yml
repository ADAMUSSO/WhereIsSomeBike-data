# Rebuilds the OpenStreetMap bike-service tiles and publishes them on GitHub Pages,
# where the Where Is Some Bike? app reads them. A run refreshes the cities built
# longest ago for a few hours; the tiles are kept in the Actions cache between runs,
# so every city comes round about once a week.
name: OSM data

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub stops a job at 6 h; the script stops starting cities well before that
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            site
            built.json
          key: osm-site-${{ github.run_id }}
          restore-keys: osm-site-
      # -u: print as it goes, so the log shows progress
      - run: python3 -u fetch-osm-places.py --out site --state built.json --budget-min 290
      # saved even when the build fails, so the next run does not start over
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            site
            built.json
          key: osm-site-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub switches schedules off after 60 days without commits; re-enabling
      # through the API keeps it running without bot commits
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/osm-data.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
