# Publishes the OpenStreetMap bike-service tiles on GitHub Pages, where the Where Is
# Some Bike? app reads them. The tiles are built on a computer by publish.sh (QLever
# refuses GitHub's servers), which uploads them to the "tiles" release and starts this.
name: OSM data

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          gh release download tiles -p site.tar.gz -R "${{ github.repository }}"
          mkdir site && tar -xzf site.tar.gz -C site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
